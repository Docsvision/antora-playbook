antora:
  extensions:
  - id: detect-unused-media
    enabled: true
    require: ./lib/detect-unused-media/detect-unused-media.js
  - require: antora-navigator-extension
    config_file: ./antora-navigator.yml
  - id: unlisted-pages
    enabled: true
    require: ./lib/unlisted.js
  - id: changes
    enabled: true
    require: ./lib/changes.js
  - id: pdf-extension
    enabled: true
    require: ./lib/pdf-extension.js
